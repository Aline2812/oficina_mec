<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Oficina Pro</title>
    <style>
      :root {
        --bg: #f5f7f9;
        --surface: #ffffff;
        --text: #17212b;
        --muted: #6b7785;
        --line: #dce3ea;
        --primary: #1f7a68;
        --primary-dark: #15594d;
        --danger: #b83a3a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: var(--bg);
        color: var(--text);
        display: flex;
        font-family: Arial, Helvetica, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 20px;
      }

      .login-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 18px 45px rgba(30, 46, 62, 0.10);
        max-width: 420px;
        padding: 28px;
        width: 100%;
      }

      h1 {
        font-size: 1.6rem;
        margin: 0 0 6px;
      }

      p {
        color: var(--muted);
        margin: 0 0 22px;
      }

      label {
        display: grid;
        font-weight: 700;
        gap: 8px;
        margin-bottom: 14px;
      }

      input {
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        padding: 12px;
        width: 100%;
      }

      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(31, 122, 104, 0.13);
        outline: 0;
      }

      button {
        background: var(--primary);
        border: 0;
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        min-height: 46px;
        width: 100%;
      }

      button:hover {
        background: var(--primary-dark);
      }

      .error {
        background: rgba(184, 58, 58, 0.09);
        border: 1px solid rgba(184, 58, 58, 0.28);
        border-radius: 8px;
        color: var(--danger);
        display: none;
        margin-bottom: 16px;
        padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <form class="login-card" method="post" action="/api/login">
      <h1>Oficina Pro</h1>
      <p>Acesso restrito aos administradores.</p>
      <div id="login-error" class="error">Usuario ou senha incorretos.</div>
      <label>Usuario
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Senha
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Entrar</button>
    </form>
    <script>
      if (new URLSearchParams(window.location.search).has("error")) {
        document.querySelector("#login-error").style.display = "block";
      }
    </script>
  </body>
</html>
